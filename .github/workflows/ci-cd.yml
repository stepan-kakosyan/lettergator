name: CI CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE_NAME: lettergator-backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: lettergator_test
          MYSQL_USER: lettergator
          MYSQL_PASSWORD: lettergator
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: lettergator_test
      DB_USER: lettergator
      DB_PASSWORD: lettergator
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      TIME_ZONE: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql

          for _ in range(30):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      user="lettergator",
                      password="lettergator",
                      database="lettergator_test",
                      port=3306,
                  )
                  conn.close()
                  print("MySQL is ready")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MySQL did not become ready in time")
          PY

      - name: Grant MySQL test database privileges
        run: |
          mysql -h 127.0.0.1 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON \`test\\_%\`.* TO 'lettergator'@'%';"
          mysql -h 127.0.0.1 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON \`lettergator_test\`.* TO 'lettergator'@'%';"
          mysql -h 127.0.0.1 -uroot -proot -e "FLUSH PRIVILEGES;"

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  docker_hub:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  validate_deploy_secrets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker_hub
    runs-on: ubuntu-latest

    steps:
      - name: Validate required deploy secrets are present
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -e

          check_required() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "MISSING: $name"
              return 1
            fi
            echo "OK: $name is set"
            return 0
          }

          failures=0
          check_required "SSH_HOST" "$SSH_HOST" || failures=$((failures + 1))
          check_required "SSH_USER" "$SSH_USER" || failures=$((failures + 1))
          check_required "SSH_PRIVATE_KEY" "$SSH_PRIVATE_KEY" || failures=$((failures + 1))
          check_required "SSH_PORT" "$SSH_PORT" || failures=$((failures + 1))
          check_required "DEPLOY_PATH" "$DEPLOY_PATH" || failures=$((failures + 1))

          if [ -z "$SSH_PASSPHRASE" ]; then
            echo "INFO: SSH_PASSPHRASE is empty (this is fine for unencrypted keys)"
          else
            echo "OK: SSH_PASSPHRASE is set"
          fi

          if [ "$failures" -gt 0 ]; then
            echo "Required secrets check failed"
            exit 1
          fi

      - name: Safe SSH key diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          line_count=$(printf "%s" "$SSH_PRIVATE_KEY" | awk 'END{print NR}')
          first_line=$(printf "%s" "$SSH_PRIVATE_KEY" | head -n 1)
          last_line=$(printf "%s" "$SSH_PRIVATE_KEY" | tail -n 1)
          key_sha=$(printf "%s" "$SSH_PRIVATE_KEY" | sha256sum | awk '{print $1}')

          if [ "$line_count" -lt 3 ]; then
            echo "ERROR: SSH_PRIVATE_KEY looks too short"
            exit 1
          fi

          case "$first_line" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"|"-----BEGIN RSA PRIVATE KEY-----"|"-----BEGIN EC PRIVATE KEY-----"|"-----BEGIN PRIVATE KEY-----")
              echo "OK: SSH_PRIVATE_KEY header looks valid"
              ;;
            *)
              echo "ERROR: SSH_PRIVATE_KEY header is not recognized"
              exit 1
              ;;
          esac

          if [ "$last_line" = "-----END OPENSSH PRIVATE KEY-----" ] || \
             [ "$last_line" = "-----END RSA PRIVATE KEY-----" ] || \
             [ "$last_line" = "-----END EC PRIVATE KEY-----" ] || \
             [ "$last_line" = "-----END PRIVATE KEY-----" ]; then
            echo "OK: SSH_PRIVATE_KEY footer looks valid"
          else
            echo "ERROR: SSH_PRIVATE_KEY footer is not recognized"
            exit 1
          fi

          echo "SSH_PRIVATE_KEY line count: $line_count"
          echo "SSH_PRIVATE_KEY sha256: $key_sha"

      - name: Print key fingerprint from secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/k
          chmod 600 /tmp/k
          ssh-keygen -l -f /tmp/k
          rm /tmp/k

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate_deploy_secrets
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --all
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            docker image prune -f