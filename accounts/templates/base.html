<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LetterGator{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white text-gray-900 antialiased selection:bg-[#014421] selection:text-white min-h-screen flex flex-col">
    {% include "partials/header.html" %}
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
    <script>
    (function () {
        function initToggleFlow(root, config) {
            var openButton = root.querySelector(config.openSelector);
            var closeButton = root.querySelector(config.closeSelector);
            var viewPanel = root.querySelector('#' + config.viewPanelId);
            var editForm = root.querySelector(config.formSelector);

            if (!openButton || !closeButton || !viewPanel || !editForm) {
                return;
            }

            if (editForm.dataset.toggleInitialized === 'true') {
                return;
            }

            function setEditMode(enabled) {
                viewPanel.classList.toggle('hidden', enabled);
                editForm.classList.toggle('hidden', !enabled);
                openButton.classList.toggle('hidden', enabled);
                if (enabled) {
                    var firstInput = editForm.querySelector('input, textarea');
                    if (firstInput) {
                        firstInput.focus();
                    }
                }
            }

            openButton.addEventListener('click', function () {
                setEditMode(true);
            });

            closeButton.addEventListener('click', function () {
                setEditMode(false);
            });

            editForm.dataset.toggleInitialized = 'true';
            setEditMode(editForm.dataset[config.errorDataset] === 'true');
        }

        function initDashboardToggles(root) {
            initToggleFlow(root, {
                openSelector: '[data-profile-edit-open]',
                closeSelector: '[data-profile-edit-close]',
                viewPanelId: 'profile-view-panel',
                formSelector: '[data-profile-edit-form]',
                errorDataset: 'profileHasErrors'
            });

            initToggleFlow(root, {
                openSelector: '[data-password-edit-open]',
                closeSelector: '[data-password-edit-close]',
                viewPanelId: 'password-view-panel',
                formSelector: '[data-password-edit-form]',
                errorDataset: 'passwordHasErrors'
            });
        }

        function initPageBehaviors(root) {
            initDashboardToggles(root || document);
        }

        function setButtonLoadingState(button, isLoading) {
            if (!button) {
                return;
            }

            if (isLoading) {
                if (!button.dataset.originalText) {
                    button.dataset.originalText = button.innerHTML;
                }
                button.disabled = true;
                button.classList.add('opacity-60', 'cursor-not-allowed');
            } else {
                button.disabled = false;
                button.classList.remove('opacity-60', 'cursor-not-allowed');
                if (button.dataset.originalText) {
                    button.innerHTML = button.dataset.originalText;
                    delete button.dataset.originalText;
                }
            }
        }

        function setFormSubmittingState(form, isLoading) {
            if (!form) {
                return;
            }

            form.querySelectorAll('button[type="submit"]').forEach(
                function (button) {
                    setButtonLoadingState(button, isLoading);
                }
            );
            form.querySelectorAll('input[type="submit"]').forEach(
                function (input) {
                    input.disabled = isLoading;
                }
            );
        }

        document.body.addEventListener('htmx:beforeRequest', function (event) {
            var element = event.detail.elt || event.target;
            var form = element.closest ? element.closest('form') : null;
            setFormSubmittingState(form, true);
        });

        document.body.addEventListener('htmx:afterRequest', function (event) {
            var element = event.detail.elt || event.target;
            var form = element.closest ? element.closest('form') : null;
            setFormSubmittingState(form, false);
        });

        document.body.addEventListener('htmx:afterSwap', function (event) {
            initPageBehaviors(event.target || document);
        });

        initPageBehaviors(document);
    }());
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
