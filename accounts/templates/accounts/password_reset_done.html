{% extends "base.html" %}

{% block title %}Recovery Email Sent | LetterGator{% endblock %}

{% block content %}
<section class="flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md border border-gray-200 rounded-2xl p-8 text-center">
        <h1 class="text-2xl font-semibold text-[#014421] tracking-tight">
            Check your email
        </h1>
        <p class="text-sm text-gray-600 mt-3">
            We sent password recovery instructions. Open the email and click the
            recovery button to continue.
        </p>
        <a
            href="{% url 'login' %}"
            class="inline-flex mt-6 px-5 py-2.5 rounded-lg border border-[#014421] text-[#014421] font-medium hover:bg-[#ecfdf3] transition-colors"
        >
            Back to login
        </a>
    </div>
</section>
{% endblock %}
