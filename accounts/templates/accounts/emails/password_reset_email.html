<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f5f7f8;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;">
                    <tr>
                        <td style="font-family:Arial,sans-serif;color:#111827;">
                            <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#014421;">
                                Reset your password
                            </h1>
                            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#374151;">
                                We received a request to reset your LetterGator password.
                            </p>
                            <p style="margin:0 0 24px;">
                                <a
                                    href="{{ protocol }}://{{ domain }}/accounts/reset/{{ uid }}/{{ token }}/"
                                    style="display:inline-block;background:#014421;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;"
                                >
                                    Recover Password
                                </a>
                            </p>
                            <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
                                If you did not request this, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
