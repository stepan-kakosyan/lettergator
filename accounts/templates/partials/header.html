{% load static %}

<header class="w-full px-6 py-2 border-b border-gray-100 relative sticky top-0 z-40 bg-white">
    <div class="max-w-5xl mx-auto flex justify-between items-center gap-3">
        <a href="{% url 'landing-page' %}" class="inline-flex items-center gap-2" aria-label="LetterGator home">
            <img src="{% static 'img/logo.png' %}" alt="LetterGator logo" class="h-[80px] w-auto">
            <span class="text-2xl font-black tracking-tighter text-[#014421]">LetterGator.</span>
        </a>

        <!-- Desktop nav -->
        <nav class="hidden md:flex gap-8 text-sm font-medium text-gray-500">
            <a href="{% url 'concept-page' %}" class="hover:text-[#014421] transition-colors">See why</a>
            <a href="{% url 'how-page' %}" class="hover:text-[#014421] transition-colors">See how</a>
            <a href="{% url 'letters-page' %}" class="hover:text-[#014421] transition-colors">Letters</a>
            <a href="{% url 'privacy-page' %}" class="hover:text-[#014421] transition-colors">Privacy</a>
        </nav>

        <div class="flex items-center gap-3">
            {% if request.user.is_authenticated %}
            <a
                href="{% url 'dashboard_view' %}"
                class="w-10 h-10 rounded-full border border-[#014421] text-[#014421] flex items-center justify-center hover:bg-[#014421] hover:text-white transition-all"
                aria-label="Open profile dashboard"
                title="Profile"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 21c0-4 3.6-7.2 8-7.2s8 3.2 8 7.2"/>
                </svg>
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="hidden md:inline-flex text-sm font-bold text-[#014421] border border-[#014421] px-4 py-2 rounded-full hover:bg-[#014421] hover:text-white transition-all">
                Login
            </a>
            {% endif %}

            <!-- Hamburger (mobile only) -->
            <button
                id="mobile-menu-btn"
                type="button"
                class="md:hidden flex flex-col justify-center items-center w-10 h-10 gap-[5px] rounded-lg hover:bg-gray-100 transition-colors"
                aria-label="Open menu"
                aria-expanded="false"
            >
                <span class="hamburger-line block w-5 h-0.5 bg-gray-700 transition-all duration-300"></span>
                <span class="hamburger-line block w-5 h-0.5 bg-gray-700 transition-all duration-300"></span>
                <span class="hamburger-line block w-5 h-0.5 bg-gray-700 transition-all duration-300"></span>
            </button>
        </div>
    </div>

    <!-- Mobile menu drawer -->
    <div
        id="mobile-menu"
        class="md:hidden hidden absolute left-0 right-0 top-full z-50 bg-white border-b border-gray-100 shadow-lg px-6 py-5"
    >
        <nav class="flex flex-col gap-4 text-sm font-medium text-gray-600">
            <a href="{% url 'concept-page' %}" class="hover:text-[#014421] transition-colors py-1">See why</a>
            <a href="{% url 'how-page' %}" class="hover:text-[#014421] transition-colors py-1">See how</a>
            <a href="{% url 'letters-page' %}" class="hover:text-[#014421] transition-colors py-1">Letters</a>
            <a href="{% url 'privacy-page' %}" class="hover:text-[#014421] transition-colors py-1">Privacy</a>
            {% if not request.user.is_authenticated %}
            <hr class="border-gray-100">
            <a href="{% url 'login' %}" class="font-bold text-[#014421]">Login</a>
            {% endif %}
        </nav>
    </div>
</header>

<script>
(function () {
    var btn  = document.getElementById("mobile-menu-btn");
    var menu = document.getElementById("mobile-menu");
    if (!btn || !menu) { return; }

    btn.addEventListener("click", function () {
        var open = menu.classList.toggle("hidden");
        btn.setAttribute("aria-expanded", String(!open));
        // Animate lines into X when open
        var lines = btn.querySelectorAll(".hamburger-line");
        if (!open) {
            lines[0].style.transform = "translateY(6.5px) rotate(45deg)";
            lines[1].style.opacity   = "0";
            lines[2].style.transform = "translateY(-6.5px) rotate(-45deg)";
        } else {
            lines[0].style.transform = "";
            lines[1].style.opacity   = "";
            lines[2].style.transform = "";
        }
    });

    // Close when a link inside the menu is clicked
    menu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            menu.classList.add("hidden");
            btn.setAttribute("aria-expanded", "false");
            var lines = btn.querySelectorAll(".hamburger-line");
            lines[0].style.transform = "";
            lines[1].style.opacity   = "";
            lines[2].style.transform = "";
        });
    });
})();
</script>
